<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Alta de Formador - SgOVI</title>
    <style>
        /*Se busco un estilo para cumplir filtros en el mensaje de error(contraste WAVE) */
        .error-msg {
            color: #b00020;
            font-size: 0.875em;
            display: block;
            margin-top: 0.25rem;
        }
        input[aria-invalid="true"],
        select[aria-invalid="true"],
        textarea[aria-invalid="true"] {
            border-color: #b00020;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <section>
        <h2>Alta de Nuevo Formador</h2>
        <p>Rellene el siguiente formulario para dar de alta a un formador en el sistema.</p>

        <div th:if="${#fields.hasAnyErrors()}"
             role="alert"
             aria-live="assertive"
             style="border: 2px solid #b00020; padding: 1rem; margin-bottom: 1rem; background-color: #fff3f3;">
            <p><strong>Por favor, corrija los siguientes errores antes de continuar:</strong></p>
            <ul>
                <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
            </ul>
        </div>

        <form th:action="@{/formadores/alta}" th:object="${formador}" method="post"
              novalidate>

            <fieldset>
                <legend>Datos Personales</legend>

                <div class="form-group">
                    <label for="dni">DNI/NIE: <span aria-hidden="true">*</span></label>
                    <input type="text"
                           id="dni"
                           th:field="*{dni}"
                           th:aria-invalid="${#fields.hasErrors('dni')} ? 'true' : 'false'"
                           aria-describedby="dni-error"
                           aria-required="true" />
                    <span id="dni-error"
                          class="error-msg"
                          th:if="${#fields.hasErrors('dni')}"
                          th:errors="*{dni}"
                          role="alert">
                    </span>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre: <span aria-hidden="true">*</span></label>
                    <input type="text"
                           id="nombre"
                           th:field="*{nombre}"
                           th:aria-invalid="${#fields.hasErrors('nombre')} ? 'true' : 'false'"
                           aria-describedby="nombre-error"
                           aria-required="true" />
                    <span id="nombre-error"
                          class="error-msg"
                          th:if="${#fields.hasErrors('nombre')}"
                          th:errors="*{nombre}"
                          role="alert">
                    </span>
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos: <span aria-hidden="true">*</span></label>
                    <input type="text"
                           id="apellidos"
                           th:field="*{apellidos}"
                           th:aria-invalid="${#fields.hasErrors('apellidos')} ? 'true' : 'false'"
                           aria-describedby="apellidos-error"
                           aria-required="true" />
                    <span id="apellidos-error"
                          class="error-msg"
                          th:if="${#fields.hasErrors('apellidos')}"
                          th:errors="*{apellidos}"
                          role="alert">
                    </span>
                </div>
            </fieldset>

            <fieldset>
                <legend>Datos de Contacto</legend>

                <div class="form-group">
                    <label for="email">Correo Electrónico: <span aria-hidden="true">*</span></label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           th:aria-invalid="${#fields.hasErrors('email')} ? 'true' : 'false'"
                           aria-describedby="email-error"
                           aria-required="true" />
                    <span id="email-error"
                          class="error-msg"
                          th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}"
                          role="alert">
                    </span>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel"
                           id="telefono"
                           th:field="*{telefono}"
                           th:aria-invalid="${#fields.hasErrors('telefono')} ? 'true' : 'false'"
                           aria-describedby="telefono-error"
                           placeholder="Ej: 612345678" />
                    <span id="telefono-error"
                          class="error-msg"
                          th:if="${#fields.hasErrors('telefono')}"
                          th:errors="*{telefono}"
                          role="alert">
                    </span>
                </div>
            </fieldset>

            <p style="margin-top: 0.5rem; font-size: 0.875em;">
                <span aria-hidden="true">*</span> Campos obligatorios
            </p>

            <div style="margin-top: 20px;">
                <button type="submit">Dar de Alta</button>
                <a th:href="@{/}" class="button">Cancelar</a>
            </div>
        </form>
    </section>
</div>
</body>
</html>
