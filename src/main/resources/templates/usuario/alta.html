<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Alta de Usuario OVI - SgOVI</title>
</head>
<body>
<div layout:fragment="content">
    <section>
        <h2>Alta de Nuevo Usuario OVI</h2>
        <p>Rellene el siguiente formulario para registrar un nuevo usuario en el sistema.</p>

        <form th:action="@{/usuarios/alta}" th:object="${usuario}" method="post">

            <fieldset>
                <legend>Datos Personales</legend>

                <div class="form-group">
                    <label for="dni">DNI/NIE:</label>
                    <input type="text" id="dni" th:field="*{dni}" required aria-required="true" />
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required aria-required="true" />
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" th:field="*{apellidos}" required aria-required="true" />
                </div>
            </fieldset>

            <fieldset>
                <legend>Contacto y Acceso</legend>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" th:field="*{email}" required aria-required="true" />
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" th:field="*{telefono}" />
                </div>

                <div class="form-group">
                    <label for="contrasena">Contraseña de acceso:</label>
                    <input type="password" id="contrasena" th:field="*{contrasena}" required aria-required="true" />
                </div>
            </fieldset>

            <fieldset>
                <legend>Consentimiento</legend>

                <div class="form-group">
                    <label for="consentimientoLopd">
                        <input type="checkbox" id="consentimientoLopd" th:field="*{consentimientoLopd}" />
                        Acepto el tratamiento de mis datos conforme a la LOPD
                    </label>
                </div>
            </fieldset>

            <div style="margin-top: 20px;">
                <button type="submit">Registrar Usuario</button>
                <a th:href="@{/usuarios}">Cancelar</a>
            </div>

        </form>
    </section>
</div>
</body>
</html>
