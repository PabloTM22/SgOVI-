<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Detalle del usuario</title>
</head>
<body>
<section layout:fragment="content">

    <h2>Detalle del usuario OVI</h2>

    <dl class="row">
        <dt class="col-sm-3">Nombre completo</dt>
        <dd class="col-sm-9" th:text="${usuario.nombre + ' ' + usuario.apellidos}"></dd>

        <dt class="col-sm-3">DNI/NIE</dt>
        <dd class="col-sm-9" th:text="${usuario.dni}"></dd>

        <dt class="col-sm-3">Correo electrónico</dt>
        <dd class="col-sm-9" th:text="${usuario.email}"></dd>

        <dt class="col-sm-3">Teléfono</dt>
        <dd class="col-sm-9" th:text="${usuario.telefono} ?: 'No indicado'"></dd>

        <dt class="col-sm-3">Consentimiento LOPD/RGPD</dt>
        <dd class="col-sm-9" th:text="${usuario.consentimientoLopd} ? 'Aceptado' : 'No aceptado'"></dd>

        <dt class="col-sm-3">Estado actual</dt>
        <dd class="col-sm-9" th:text="${usuario.estado}"></dd>
    </dl>

    <div class="d-flex gap-2 mt-3">
        <form th:action="@{/usuarios/aceptar/{id}(id=${usuario.idUsuario})}" method="post">
            <button type="submit" class="btn btn-success">Aceptar usuario</button>
        </form>
        <form th:action="@{/usuarios/rechazar/{id}(id=${usuario.idUsuario})}" method="post">
            <button type="submit" class="btn btn-danger">Rechazar usuario</button>
        </form>
        <a th:href="@{/usuarios/revision}" class="btn btn-secondary">Volver</a>
    </div>

</section>
</body>
</html>
