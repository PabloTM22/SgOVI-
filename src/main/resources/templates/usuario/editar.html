<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Editar Usuario OVI - SgOVI</title>
</head>
<body>
<div layout:fragment="content">
    <section>
        <h2>Editar Usuario OVI</h2>

        <div th:if="${#fields.hasAnyErrors()}"
             role="alert"
             aria-live="assertive"
             class="error-summary">
            <p><strong>Por favor, corrija los siguientes errores antes de continuar:</strong></p>
            <ul>
                <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
            </ul>
        </div>

        <form th:action="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}"
              th:object="${usuario}"
              method="post"
              novalidate>

            <fieldset>
                <legend>Datos Personales</legend>

                <div class="form-group">
                    <label for="dni">DNI/NIE: <span aria-hidden="true">*</span></label>
                    <input type="text"
                           id="dni"
                           th:field="*{dni}"
                           th:aria-invalid="${#fields.hasErrors('dni')} ? 'true' : 'false'"
                           aria-describedby="dni-error"
                           aria-required="true"
                           maxlength="9" />
                    <span id="dni-error"
                          class="error"
                          th:if="${#fields.hasErrors('dni')}"
                          th:errors="*{dni}"
                          role="alert">
                    </span>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre: <span aria-hidden="true">*</span></label>
                    <input type="text"
                           id="nombre"
                           th:field="*{nombre}"
                           th:aria-invalid="${#fields.hasErrors('nombre')} ? 'true' : 'false'"
                           aria-describedby="nombre-error"
                           aria-required="true"
                           maxlength="100" />
                    <span id="nombre-error"
                          class="error"
                          th:if="${#fields.hasErrors('nombre')}"
                          th:errors="*{nombre}"
                          role="alert">
                    </span>
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos: <span aria-hidden="true">*</span></label>
                    <input type="text"
                           id="apellidos"
                           th:field="*{apellidos}"
                           th:aria-invalid="${#fields.hasErrors('apellidos')} ? 'true' : 'false'"
                           aria-describedby="apellidos-error"
                           aria-required="true"
                           maxlength="150" />
                    <span id="apellidos-error"
                          class="error"
                          th:if="${#fields.hasErrors('apellidos')}"
                          th:errors="*{apellidos}"
                          role="alert">
                    </span>
                </div>
            </fieldset>

            <fieldset>
                <legend>Contacto y Acceso</legend>

                <div class="form-group">
                    <label for="email">Correo Electrónico: <span aria-hidden="true">*</span></label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           th:aria-invalid="${#fields.hasErrors('email')} ? 'true' : 'false'"
                           aria-describedby="email-error"
                           aria-required="true"
                           maxlength="150" />
                    <span id="email-error"
                          class="error"
                          th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}"
                          role="alert">
                    </span>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel"
                           id="telefono"
                           th:field="*{telefono}"
                           maxlength="20" />
                </div>

                <div class="form-group">
                    <label for="contrasena">Contraseña de acceso: <span aria-hidden="true">*</span></label>
                    <input type="password"
                           id="contrasena"
                           th:field="*{contrasena}"
                           th:aria-invalid="${#fields.hasErrors('contrasena')} ? 'true' : 'false'"
                           aria-describedby="contrasena-error"
                           aria-required="true" />
                    <span id="contrasena-error"
                          class="error"
                          th:if="${#fields.hasErrors('contrasena')}"
                          th:errors="*{contrasena}"
                          role="alert">
                    </span>
                </div>
            </fieldset>

            <fieldset>
                <legend>Consentimiento y Estado</legend>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="consentimientoLopd" th:field="*{consentimientoLopd}" />
                        Acepto el tratamiento de mis datos conforme a la LOPD
                    </label>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="aceptadoTecnico" th:field="*{aceptadoTecnico}" />
                        Aceptado por técnico OVI
                    </label>
                </div>
            </fieldset>

            <p style="font-size: 0.875em;"><span aria-hidden="true">*</span> Campos obligatorios</p>

            <div style="margin-top: 20px;">
                <button type="submit">Guardar Cambios</button>
                <a th:href="@{/usuarios}">Cancelar</a>
            </div>

        </form>
    </section>
</div>
</body>
</html>
