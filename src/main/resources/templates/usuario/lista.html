<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Usuarios OVI</title>
</head>
<body>
<section layout:fragment="content">

    <h2>Usuarios OVI</h2>

    <div th:if="${errorBorrar}" class="alert alert-danger" th:text="${errorBorrar}" role="alert"></div>

    <p>
        <a th:href="@{/usuarios/alta}" class="btn btn-primary">Dar de alta nuevo usuario</a>
        <a th:href="@{/usuarios/revision}" class="btn btn-outline-primary">Revisar pendientes</a>
    </p>

    <table class="table table-striped table-bordered">
        <thead class="table-light">
        <tr>
            <th scope="col">DNI</th>
            <th scope="col">Nombre Completo</th>
            <th scope="col">Email</th>
            <th scope="col">Teléfono</th>
            <th scope="col">Estado</th>
            <th scope="col">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="6" class="text-center">No hay usuarios registrados en el sistema.</td>
        </tr>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.dni}"></td>
            <td th:text="${u.nombre} + ' ' + ${u.apellidos}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.telefono}"></td>
            <td th:text="${u.estado}"></td>
            <td>
                <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}"
                   class="btn btn-sm btn-outline-warning">Editar</a>
                <form th:action="@{/usuarios/borrar/{id}(id=${u.idUsuario})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('¿Seguro que quieres eliminar este usuario?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Borrar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>

</section>
</body>
</html>
