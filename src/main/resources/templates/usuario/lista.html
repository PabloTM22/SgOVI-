<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Usuarios OVI - SgOVI</title>
</head>
<body>
<div layout:fragment="content">

    <h2>Usuarios OVI</h2>
    <p><a th:href="@{/usuarios/alta}">Dar de alta nuevo usuario</a></p>

    <table aria-describedby="tabla-desc">
        <caption id="tabla-desc" style="display:none">Listado de todos los usuarios registrados en el sistema OVI</caption>
        <thead>
        <tr>
            <th scope="col">ID Usuario</th>
            <th scope="col">DNI</th>
            <th scope="col">Nombre Completo</th>
            <th scope="col">Email</th>
            <th scope="col">Teléfono</th>
            <th scope="col">Aceptado</th>
            <th scope="col">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="7" style="text-align: center;">No hay usuarios registrados en el sistema.</td>
        </tr>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.idUsuario}"></td>
            <td th:text="${u.dni}"></td>
            <td th:text="${u.nombre} + ' ' + ${u.apellidos}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.telefono}"></td>
            <td th:text="${u.aceptadoTecnico} ? 'Sí' : 'No'"></td>
            <td>
                <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}"
                   th:aria-label="'Editar usuario ' + ${u.nombre}">
                    Editar
                </a>
                |
                <a th:href="@{/usuarios/borrar/{id}(id=${u.idUsuario})}"
                   th:aria-label="'Borrar usuario ' + ${u.nombre}"
                   onclick="return confirm('¿Está seguro de que desea eliminar este usuario?')">
                    Borrar
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <nav aria-label="Navegación secundaria">
        <p><a th:href="@{/}">Volver al inicio</a></p>
    </nav>

</div>
</body>
</html>
