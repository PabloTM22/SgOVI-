<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Usuarios OVI</title>
</head>
<body>
<section layout:fragment="content">

    <h2>Usuarios OVI</h2>

    <p>
        <a th:href="@{/usuarios/alta}" class="btn btn-primary">Dar de alta nuevo usuario</a>
        <a th:href="@{/usuarios/revision}" class="btn btn-outline-primary">Revisar pendientes</a>
    </p>

    <form th:action="@{/usuarios}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-md-4">
            <label for="buscar" class="form-label">Buscar</label>
            <input type="text" id="buscar" name="buscar" class="form-control"
                   th:value="${buscar}" placeholder="Nombre, DNI o email">
        </div>
        <div class="col-md-3">
            <label for="estado" class="form-label">Estado</label>
            <select id="estado" name="estado" class="form-select">
                <option value="TODOS" th:selected="${filtroEstado == 'TODOS'}">Todos</option>
                <option value="pendiente" th:selected="${filtroEstado == 'pendiente'}">Pendiente</option>
                <option value="aceptado" th:selected="${filtroEstado == 'aceptado'}">Aceptado</option>
                <option value="rechazado" th:selected="${filtroEstado == 'rechazado'}">Rechazado</option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="orden" class="form-label">Ordenar por</label>
            <select id="orden" name="orden" class="form-select">
                <option value="apellidos" th:selected="${filtroOrden == 'apellidos'}">Apellidos</option>
                <option value="nombre" th:selected="${filtroOrden == 'nombre'}">Nombre</option>
                <option value="estado" th:selected="${filtroOrden == 'estado'}">Estado</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-secondary w-100">Aplicar</button>
        </div>
    </form>

    <p class="text-body-secondary" th:text="${totalRegistros + ' usuario(s) encontrados'}"></p>

    <table class="table table-striped table-bordered">
        <thead class="table-light">
        <tr>
            <th scope="col">DNI</th>
            <th scope="col">Nombre completo</th>
            <th scope="col">Email</th>
            <th scope="col">Teléfono</th>
            <th scope="col">Estado</th>
            <th scope="col">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="6" class="text-center">No se han encontrado usuarios con esos criterios.</td>
        </tr>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.dni}"></td>
            <td th:text="${u.nombre} + ' ' + ${u.apellidos}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.telefono}"></td>
            <td th:text="${u.estado}"></td>
            <td>
                <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}"
                   class="btn btn-sm btn-outline-warning">Editar</a>
                <form th:action="@{/usuarios/borrar/{id}(id=${u.idUsuario})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('¿Seguro que quieres eliminar este usuario?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Borrar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${totalPaginas > 1}" aria-label="Paginación de usuarios">
        <ul class="pagination">
            <li class="page-item" th:classappend="${paginaActual == 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/usuarios(page=${paginaActual - 1},buscar=${buscar},estado=${filtroEstado},orden=${filtroOrden})}">Anterior</a>
            </li>
            <li class="page-item" th:each="n : ${numerosPagina}"
                th:classappend="${n == paginaActual} ? 'active'">
                <a class="page-link"
                   th:href="@{/usuarios(page=${n},buscar=${buscar},estado=${filtroEstado},orden=${filtroOrden})}"
                   th:text="${n}"></a>
            </li>
            <li class="page-item" th:classappend="${paginaActual == totalPaginas} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/usuarios(page=${paginaActual + 1},buscar=${buscar},estado=${filtroEstado},orden=${filtroOrden})}">Siguiente</a>
            </li>
        </ul>
    </nav>

    <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>

</section>
</body>
</html>
