<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
  <title>Mis Solicitudes</title>
</head>
<body>
<section layout:fragment="content">

  <h2>Mis solicitudes de asistencia personal</h2>

  <p>
    <a th:href="@{/solicitudes/nueva}" class="btn btn-primary">Nueva solicitud</a>
  </p>

  <div th:if="${errorBorrar}" class="alert alert-danger" th:text="${errorBorrar}"></div>

  <table class="table table-striped table-bordered">
    <thead class="table-light">
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Tipo</th>
      <th scope="col">Estado</th>
      <th scope="col">Fecha</th>
      <th scope="col">Preferencias</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(solicitudes)}">
      <td colspan="5" class="text-center">No tiene solicitudes registradas.</td>
    </tr>
    <tr th:each="s : ${solicitudes}">
      <td th:text="${s.idSolicitud}"></td>
      <td th:text="${s.tipoAsistencia}"></td>
      <td>
                <span th:text="${s.estado}"
                      th:classappend="
                        ${s.estado == 'en revision'}         ? 'badge bg-secondary' :
                        (${s.estado == 'aprobada'}           ? 'badge bg-success'   :
                        (${s.estado == 'rechazada'}          ? 'badge bg-danger'    :
                        (${s.estado == 'cerrada con contrato'} ? 'badge bg-primary' : 'badge bg-light text-dark')))">
                </span>
      </td>
      <td th:text="${#temporals.format(s.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
      <td th:text="${s.preferencias}"></td>
    </tr>
    </tbody>
  </table>

  <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>

</section>
</body>
</html>
