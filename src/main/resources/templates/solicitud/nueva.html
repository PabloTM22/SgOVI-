<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Nueva Solicitud</title>
</head>
<body>
<section layout:fragment="content">

    <h2>Nueva solicitud de asistencia personal</h2>
    <p>Seleccione el tipo de asistencia que necesita y añada sus preferencias.</p>

    <form th:action="@{/solicitudes/nueva}" th:object="${solicitud}" method="post" novalidate>

        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert">
            <p><strong>Por favor, corrija los siguientes errores antes de continuar:</strong></p>
            <ul class="mb-0">
                <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
            </ul>
        </div>

        <div class="row mb-3">
            <label for="tipoAsistencia" class="col-sm-3 col-form-label">Tipo de asistencia: *</label>
            <div class="col-sm-6">
                <select id="tipoAsistencia" th:field="*{tipoAsistencia}"
                        class="form-select"
                        th:classappend="${#fields.hasErrors('tipoAsistencia')} ? 'is-invalid'">
                    <option value="">-- Seleccione un tipo --</option>
                    <option value="PAP">PAP - Professional d'Assistència Personal</option>
                    <option value="PATI">PATI - Professional d'Assistència Terapèutica Infantil</option>
                </select>
                <div th:if="${#fields.hasErrors('tipoAsistencia')}"
                     th:errors="*{tipoAsistencia}"
                     class="error" role="alert"></div>
            </div>
        </div>

        <div class="row mb-3">
            <label for="preferencias" class="col-sm-3 col-form-label">Preferencias:</label>
            <div class="col-sm-6">
                <textarea id="preferencias" th:field="*{preferencias}"
                          rows="4" class="form-control"
                          placeholder="Indique sus preferencias horarias, ubicación, etc."></textarea>
            </div>
        </div>

        <p class="small">* Campos obligatorios</p>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Enviar solicitud</button>
            <a th:href="@{/solicitudes/lista}" class="btn btn-secondary">Cancelar</a>
        </div>

    </form>

</section>
</body>
</html>
