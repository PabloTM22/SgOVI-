<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Candidatos PAP/PATI</title>
</head>
<body>
<section layout:fragment="content">

    <h2>Candidatos Pendientes de Validación</h2>
    <p>Revise el perfil de los aspirantes antes de incorporarlos a la bolsa.</p>

    <form th:action="@{/candidatos/revision}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-md-4">
            <label for="buscar" class="form-label">Buscar</label>
            <input type="text" id="buscar" name="buscar" class="form-control"
                   th:value="${buscar}" placeholder="Nombre o DNI">
        </div>
        <div class="col-md-3">
            <label for="tipo" class="form-label">Tipo</label>
            <select id="tipo" name="tipo" class="form-select">
                <option value="TODOS" th:selected="${filtroTipo == 'TODOS'}">Todos</option>
                <option value="PAP" th:selected="${filtroTipo == 'PAP'}">PAP</option>
                <option value="PATI" th:selected="${filtroTipo == 'PATI'}">PATI</option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="orden" class="form-label">Ordenar por</label>
            <select id="orden" name="orden" class="form-select">
                <option value="apellidos" th:selected="${filtroOrden == 'apellidos'}">Apellidos</option>
                <option value="nombre" th:selected="${filtroOrden == 'nombre'}">Nombre</option>
                <option value="tipo" th:selected="${filtroOrden == 'tipo'}">Tipo</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-secondary w-100">Aplicar</button>
        </div>
    </form>

    <p class="text-body-secondary" th:text="${totalRegistros + ' candidato(s) pendientes'}"></p>

    <table class="table table-striped table-bordered">
        <thead class="table-light">
        <tr>
            <th scope="col">Nombre</th>
            <th scope="col">DNI</th>
            <th scope="col">Tipo</th>
            <th scope="col">Formación</th>
            <th scope="col">Experiencia</th>
            <th scope="col">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(candidatos)}">
            <td colspan="6" class="text-center">No hay candidatos pendientes con esos criterios.</td>
        </tr>
        <tr th:each="c : ${candidatos}">
            <td th:text="${c.nombre} + ' ' + ${c.apellidos}"></td>
            <td th:text="${c.dni}"></td>
            <td th:text="${c.tipoAp}"></td>
            <td th:text="${c.formacion}"></td>
            <td th:text="${c.experiencia}"></td>
            <td>
                <a th:href="@{/candidatos/detalle/{id}(id=${c.idAp})}"
                   class="btn btn-sm btn-outline-primary">Ver y revisar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${totalPaginas > 1}" aria-label="Paginación de candidatos">
        <ul class="pagination">
            <li class="page-item" th:classappend="${paginaActual == 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/candidatos/revision(page=${paginaActual - 1},buscar=${buscar},tipo=${filtroTipo},orden=${filtroOrden})}">Anterior</a>
            </li>
            <li class="page-item" th:each="n : ${numerosPagina}"
                th:classappend="${n == paginaActual} ? 'active'">
                <a class="page-link"
                   th:href="@{/candidatos/revision(page=${n},buscar=${buscar},tipo=${filtroTipo},orden=${filtroOrden})}"
                   th:text="${n}"></a>
            </li>
            <li class="page-item" th:classappend="${paginaActual == totalPaginas} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/candidatos/revision(page=${paginaActual + 1},buscar=${buscar},tipo=${filtroTipo},orden=${filtroOrden})}">Siguiente</a>
            </li>
        </ul>
    </nav>

    <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>

</section>
</body>
</html>
