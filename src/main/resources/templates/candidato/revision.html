<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Candidatos PAP/PATI</title>
</head>
<body>
<section layout:fragment="content">

    <h2>Candidatos Pendientes de Validación</h2>
    <p>Revise el perfil de los aspirantes antes de incorporarlos a la bolsa.</p>

    <div th:if="${errorBorrar}" class="alert alert-danger" th:text="${errorBorrar}" role="alert"></div>

    <table class="table table-striped table-bordered">
        <thead class="table-light">
        <tr>
            <th scope="col">Nombre</th>
            <th scope="col">DNI</th>
            <th scope="col">Tipo</th>
            <th scope="col">Formación</th>
            <th scope="col">Experiencia</th>
            <th scope="col">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(candidatos)}">
            <td colspan="6" class="text-center">No hay solicitudes pendientes.</td>
        </tr>
        <tr th:each="c : ${candidatos}">
            <td th:text="${c.nombre} + ' ' + ${c.apellidos}"></td>
            <td th:text="${c.dni}"></td>
            <td th:text="${c.tipoAp}"></td>
            <td th:text="${c.formacion}"></td>
            <td th:text="${c.experiencia}"></td>
            <td>
                <a th:href="@{/candidatos/detalle/{id}(id=${c.idAp})}"
                   class="btn btn-sm btn-outline-primary">Ver y revisar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>

</section>
</body>
</html>
