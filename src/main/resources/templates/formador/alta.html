

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Alta de Formador</title>
</head>
<body>
<section layout:fragment="content">

    <h2>Alta de Nuevo Formador</h2>
    <p>Rellene el siguiente formulario para dar de alta a un formador en el sistema.</p>

    <form th:action="@{/formadores/alta}" th:object="${formador}" method="post" novalidate>

        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert">
            <p><strong>Por favor, corrija los siguientes errores antes de continuar:</strong></p>
            <ul class="mb-0">
                <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
            </ul>
        </div>

        <fieldset class="mb-3">
            <legend>Datos Personales</legend>

            <div class="row mb-3">
                <label for="dni" class="col-sm-3 col-form-label">DNI/NIE: *</label>
                <div class="col-sm-6">
                    <input type="text" id="dni" th:field="*{dni}" maxlength="15"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid'"/>
                    <div th:if="${#fields.hasErrors('dni')}"
                         th:errors="*{dni}" class="error" role="alert"></div>
                </div>
            </div>

            <div class="row mb-3">
                <label for="nombre" class="col-sm-3 col-form-label">Nombre: *</label>
                <div class="col-sm-6">
                    <input type="text" id="nombre" th:field="*{nombre}" maxlength="100"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"/>
                    <div th:if="${#fields.hasErrors('nombre')}"
                         th:errors="*{nombre}" class="error" role="alert"></div>
                </div>
            </div>

            <div class="row mb-3">
                <label for="apellidos" class="col-sm-3 col-form-label">Apellidos: *</label>
                <div class="col-sm-6">
                    <input type="text" id="apellidos" th:field="*{apellidos}" maxlength="150"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'"/>
                    <div th:if="${#fields.hasErrors('apellidos')}"
                         th:errors="*{apellidos}" class="error" role="alert"></div>
                </div>
            </div>
        </fieldset>

        <fieldset class="mb-3">
            <legend>Datos de Contacto y Acceso</legend>

            <div class="row mb-3">
                <label for="email" class="col-sm-3 col-form-label">Correo Electrónico: *</label>
                <div class="col-sm-6">
                    <input type="email" id="email" th:field="*{email}" maxlength="150"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                    <div th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}" class="error" role="alert"></div>
                </div>
            </div>

            <div class="row mb-3">
                <label for="telefono" class="col-sm-3 col-form-label">Teléfono:</label>
                <div class="col-sm-6">
                    <input type="tel" id="telefono" th:field="*{telefono}" maxlength="20"
                           class="form-control"
                           placeholder="Ej: 612345678"/>
                </div>
            </div>

            <div class="row mb-3">
                <label for="contrasena" class="col-sm-3 col-form-label">Contraseña de acceso: *</label>
                <div class="col-sm-6">
                    <input type="password" id="contrasena" name="contrasena"
                           class="form-control" autocomplete="new-password"/>
                </div>
            </div>
        </fieldset>

        <p class="small">* Campos obligatorios</p>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Dar de alta</button>
            <a th:href="@{/formadores}" class="btn btn-secondary">Cancelar</a>
        </div>

    </form>

</section>
</body>
</html>
