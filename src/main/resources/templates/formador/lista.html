<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Formadores</title>
</head>
<body>
<section layout:fragment="content">

    <h2>Formadores</h2>

    <p>
        <a th:href="@{/formadores/alta}" class="btn btn-primary">Dar de alta nuevo formador</a>
    </p>

    <form th:action="@{/formadores}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-md-5">
            <label for="buscar" class="form-label">Buscar</label>
            <input type="text" id="buscar" name="buscar" class="form-control"
                   th:value="${buscar}" placeholder="Nombre, DNI o email">
        </div>
        <div class="col-md-4">
            <label for="orden" class="form-label">Ordenar por</label>
            <select id="orden" name="orden" class="form-select">
                <option value="apellidos" th:selected="${filtroOrden == 'apellidos'}">Apellidos</option>
                <option value="nombre" th:selected="${filtroOrden == 'nombre'}">Nombre</option>
                <option value="email" th:selected="${filtroOrden == 'email'}">Email</option>
            </select>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-secondary w-100">Aplicar</button>
        </div>
    </form>

    <p class="text-body-secondary" th:text="${totalRegistros + ' formador(es) encontrados'}"></p>

    <table class="table table-striped table-bordered">
        <thead class="table-light">
        <tr>
            <th scope="col">DNI</th>
            <th scope="col">Nombre completo</th>
            <th scope="col">Email</th>
            <th scope="col">Teléfono</th>
            <th scope="col">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(formadores)}">
            <td colspan="5" class="text-center">No se han encontrado formadores con esos criterios.</td>
        </tr>
        <tr th:each="f : ${formadores}">
            <td th:text="${f.dni}"></td>
            <td th:text="${f.nombre} + ' ' + ${f.apellidos}"></td>
            <td th:text="${f.email}"></td>
            <td th:text="${f.telefono}"></td>
            <td>
                <a th:href="@{/formadores/editar/{id}(id=${f.idFormador})}"
                   class="btn btn-sm btn-outline-warning">Editar</a>
                <form th:action="@{/formadores/borrar/{id}(id=${f.idFormador})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('¿Seguro que quieres eliminar este formador?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Borrar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${totalPaginas > 1}" aria-label="Paginación de formadores">
        <ul class="pagination">
            <li class="page-item" th:classappend="${paginaActual == 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/formadores(page=${paginaActual - 1},buscar=${buscar},orden=${filtroOrden})}">Anterior</a>
            </li>
            <li class="page-item" th:each="n : ${numerosPagina}"
                th:classappend="${n == paginaActual} ? 'active'">
                <a class="page-link"
                   th:href="@{/formadores(page=${n},buscar=${buscar},orden=${filtroOrden})}"
                   th:text="${n}"></a>
            </li>
            <li class="page-item" th:classappend="${paginaActual == totalPaginas} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/formadores(page=${paginaActual + 1},buscar=${buscar},orden=${filtroOrden})}">Siguiente</a>
            </li>
        </ul>
    </nav>

    <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>

</section>
</body>
</html>
