<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Detalle de la solicitud</title>
</head>
<body>
<section layout:fragment="content">

    <h2>Detalle de la solicitud</h2>

    <div class="card mb-4">
        <div class="card-body">
            <h3 class="h5 card-title">Datos de la solicitud</h3>
            <dl class="row mb-0">
                <dt class="col-sm-3">Tipo de asistencia</dt>
                <dd class="col-sm-9" th:text="${solicitud.tipoAsistencia}"></dd>

                <dt class="col-sm-3">Estado</dt>
                <dd class="col-sm-9">
                    <span th:text="${solicitud.estado}"
                          th:classappend="
                            ${solicitud.estado == 'en revision'}                       ? 'badge bg-secondary' :
                            (${solicitud.estado == 'aprobada'}                         ? 'badge bg-success'   :
                            (${solicitud.estado == 'rechazada'}                        ? 'badge bg-danger'    :
                            (${solicitud.estado == 'cerrada con contrato'}             ? 'badge bg-primary'   :
                            (${solicitud.estado == 'cerrada con contrato finalizado'}  ? 'badge bg-dark'      : 'badge bg-light text-dark'))))"></span>
                </dd>

                <dt class="col-sm-3">Fecha de solicitud</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(solicitud.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></dd>

                <dt class="col-sm-3">Preferencias</dt>
                <dd class="col-sm-9"
                    th:text="${solicitud.preferencias != null and !#strings.isEmpty(solicitud.preferencias)
                              ? solicitud.preferencias : 'Sin preferencias indicadas'}"></dd>
            </dl>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h3 class="h5 card-title">Persona solicitante</h3>
            <dl class="row mb-0" th:if="${usuario != null}">
                <dt class="col-sm-3">Nombre</dt>
                <dd class="col-sm-9" th:text="${usuario.nombre + ' ' + usuario.apellidos}"></dd>

                <dt class="col-sm-3">DNI/NIE</dt>
                <dd class="col-sm-9" th:text="${usuario.dni}"></dd>

                <dt class="col-sm-3">Email</dt>
                <dd class="col-sm-9" th:text="${usuario.email}"></dd>

                <dt class="col-sm-3">Teléfono</dt>
                <dd class="col-sm-9"
                    th:text="${usuario.telefono != null and !#strings.isEmpty(usuario.telefono) ? usuario.telefono : 'No indicado'}"></dd>
            </dl>
            <p th:unless="${usuario != null}" class="text-body-secondary mb-0">
                No se han podido recuperar los datos del solicitante.
            </p>
        </div>
    </div>

    <div class="d-flex gap-2">
        <form th:if="${solicitud.estado == 'en revision'}"
              th:action="@{/tecnico/solicitudes/{id}/aprobar(id=${solicitud.idSolicitud})}"
              method="post" class="d-inline">
            <button type="submit" class="btn btn-success">Aprobar solicitud</button>
        </form>
        <form th:if="${solicitud.estado == 'en revision'}"
              th:action="@{/tecnico/solicitudes/{id}/rechazar(id=${solicitud.idSolicitud})}"
              method="post" class="d-inline"
              onsubmit="return confirm('¿Seguro que desea rechazar esta solicitud?');">
            <button type="submit" class="btn btn-danger">Rechazar solicitud</button>
        </form>
        <a th:if="${solicitud.estado == 'aprobada'}"
           th:href="@{/tecnico/solicitudes/{id}/candidatos(id=${solicitud.idSolicitud})}"
           class="btn btn-outline-primary">Proponer candidatos</a>
        <a th:href="@{/tecnico/solicitudes}" class="btn btn-secondary">Volver al listado</a>
    </div>

</section>
</body>
</html>
