<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Detalle del candidato</title>
</head>
<body>
<section layout:fragment="content">

    <h2>Detalle del candidato</h2>

    <p class="text-body-secondary">
        Candidato para una solicitud de tipo
        <span th:text="${solicitud.tipoAsistencia}"></span>.
    </p>

    <div class="card mb-4">
        <div class="card-body">
            <h3 class="h5 card-title"
                th:text="${candidato.nombre + ' ' + candidato.apellidos}"></h3>
            <dl class="row mb-0">
                <dt class="col-sm-3">Tipo</dt>
                <dd class="col-sm-9" th:text="${candidato.tipoAp}"></dd>

                <dt class="col-sm-3">DNI/NIE</dt>
                <dd class="col-sm-9" th:text="${candidato.dni}"></dd>

                <dt class="col-sm-3">Correo</dt>
                <dd class="col-sm-9" th:text="${candidato.email}"></dd>

                <dt class="col-sm-3">Teléfono</dt>
                <dd class="col-sm-9"
                    th:text="${candidato.telefono != null and !#strings.isEmpty(candidato.telefono) ? candidato.telefono : 'No indicado'}"></dd>

                <dt class="col-sm-3">Disponibilidad</dt>
                <dd class="col-sm-9"
                    th:text="${candidato.disponibilidad != null and !#strings.isEmpty(candidato.disponibilidad) ? candidato.disponibilidad : 'No indicada'}"></dd>

                <dt class="col-sm-3">Formación</dt>
                <dd class="col-sm-9"
                    th:text="${candidato.formacion != null and !#strings.isEmpty(candidato.formacion) ? candidato.formacion : 'No indicada'}"></dd>

                <dt class="col-sm-3">Experiencia</dt>
                <dd class="col-sm-9"
                    th:text="${candidato.experiencia != null and !#strings.isEmpty(candidato.experiencia) ? candidato.experiencia : 'No indicada'}"></dd>
            </dl>
        </div>
    </div>

    <a th:href="@{/tecnico/solicitudes/{id}/candidatos(id=${solicitud.idSolicitud})}"
       class="btn btn-secondary">Volver a la propuesta de candidatos</a>

</section>
</body>
</html>
