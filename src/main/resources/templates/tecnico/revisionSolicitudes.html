<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Panel técnico - Solicitudes</title>
</head>
<body>
<section layout:fragment="content">

    <h2>Solicitudes de asistencia personal</h2>

    <form th:action="@{/tecnico/solicitudes}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-md-3">
            <label for="buscar" class="form-label">Buscar solicitante</label>
            <input type="text" id="buscar" name="buscar" class="form-control"
                   th:value="${buscar}" placeholder="Nombre del usuario">
        </div>
        <div class="col-md-2">
            <label for="tipo" class="form-label">Tipo</label>
            <select id="tipo" name="tipo" class="form-select">
                <option value="TODOS" th:selected="${filtroTipo == 'TODOS'}">Todos</option>
                <option value="PAP" th:selected="${filtroTipo == 'PAP'}">PAP</option>
                <option value="PATI" th:selected="${filtroTipo == 'PATI'}">PATI</option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="estado" class="form-label">Estado</label>
            <select id="estado" name="estado" class="form-select">
                <option value="TODOS" th:selected="${filtroEstado == 'TODOS'}">Todos</option>
                <option value="en revision" th:selected="${filtroEstado == 'en revision'}">En revisión</option>
                <option value="aprobada" th:selected="${filtroEstado == 'aprobada'}">Aprobada</option>
                <option value="rechazada" th:selected="${filtroEstado == 'rechazada'}">Rechazada</option>
                <option value="cerrada con contrato" th:selected="${filtroEstado == 'cerrada con contrato'}">Cerrada con contrato</option>
                <option value="cerrada con contrato finalizado" th:selected="${filtroEstado == 'cerrada con contrato finalizado'}">Contrato finalizado</option>
            </select>
        </div>
        <div class="col-md-2">
            <label for="orden" class="form-label">Ordenar por</label>
            <select id="orden" name="orden" class="form-select">
                <option value="fecha" th:selected="${filtroOrden == 'fecha'}">Fecha</option>
                <option value="estado" th:selected="${filtroOrden == 'estado'}">Estado</option>
                <option value="tipo" th:selected="${filtroOrden == 'tipo'}">Tipo</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-secondary w-100">Aplicar</button>
        </div>
    </form>

    <p class="text-body-secondary" th:text="${totalRegistros + ' solicitud(es) encontradas'}"></p>

    <table class="table table-striped table-bordered">
        <thead class="table-light">
        <tr>
            <th scope="col">Solicitante</th>
            <th scope="col">Tipo</th>
            <th scope="col">Estado</th>
            <th scope="col">Fecha</th>
            <th scope="col">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(solicitudes)}">
            <td colspan="5" class="text-center">No se han encontrado solicitudes con esos criterios.</td>
        </tr>
        <tr th:each="s : ${solicitudes}">
            <td th:text="${nombrePorSolicitud.get(s.idSolicitud)}"></td>
            <td th:text="${s.tipoAsistencia}"></td>
            <td>
                <span th:text="${s.estado}"
                      th:classappend="
                        ${s.estado == 'en revision'}                       ? 'badge bg-secondary' :
                        (${s.estado == 'aprobada'}                         ? 'badge bg-success'   :
                        (${s.estado == 'rechazada'}                        ? 'badge bg-danger'    :
                        (${s.estado == 'cerrada con contrato'}             ? 'badge bg-primary'   :
                        (${s.estado == 'cerrada con contrato finalizado'}  ? 'badge bg-dark'      : 'badge bg-light text-dark'))))">
                </span>
            </td>
            <td th:text="${#temporals.format(s.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
                <form th:if="${s.estado == 'en revision'}"
                      th:action="@{/tecnico/solicitudes/{id}/aprobar(id=${s.idSolicitud})}"
                      method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-success">Aprobar</button>
                </form>
                <form th:if="${s.estado == 'en revision'}"
                      th:action="@{/tecnico/solicitudes/{id}/rechazar(id=${s.idSolicitud})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('¿Seguro que desea rechazar esta solicitud?');">
                    <button type="submit" class="btn btn-sm btn-danger">Rechazar</button>
                </form>
                <a th:if="${s.estado == 'aprobada'}"
                   th:href="@{/tecnico/solicitudes/{id}/candidatos(id=${s.idSolicitud})}"
                   class="btn btn-sm btn-outline-primary">Proponer candidatos</a>
                <a th:if="${(s.estado == 'cerrada con contrato' or s.estado == 'cerrada con contrato finalizado')
                            and contratoPorSolicitud.containsKey(s.idSolicitud)}"
                   th:href="@{/contratos/{id}(id=${contratoPorSolicitud.get(s.idSolicitud)})}"
                   class="btn btn-sm btn-outline-primary">Ver contrato</a>
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${totalPaginas > 1}" aria-label="Paginación de solicitudes">
        <ul class="pagination">
            <li class="page-item" th:classappend="${paginaActual == 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/tecnico/solicitudes(page=${paginaActual - 1},buscar=${buscar},tipo=${filtroTipo},estado=${filtroEstado},orden=${filtroOrden})}">Anterior</a>
            </li>
            <li class="page-item" th:each="n : ${numerosPagina}"
                th:classappend="${n == paginaActual} ? 'active'">
                <a class="page-link"
                   th:href="@{/tecnico/solicitudes(page=${n},buscar=${buscar},tipo=${filtroTipo},estado=${filtroEstado},orden=${filtroOrden})}"
                   th:text="${n}"></a>
            </li>
            <li class="page-item" th:classappend="${paginaActual == totalPaginas} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/tecnico/solicitudes(page=${paginaActual + 1},buscar=${buscar},tipo=${filtroTipo},estado=${filtroEstado},orden=${filtroOrden})}">Siguiente</a>
            </li>
        </ul>
    </nav>

    <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>

</section>
</body>
</html>
