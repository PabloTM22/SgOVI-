<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Revisión de Solicitudes</title>
</head>
<body>
<div layout:fragment="content">

    <h2>Solicitudes pendientes de revisión</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Tipo</th>
            <th>Fecha</th>
            <th>Preferencias</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(solicitudes)}">
            <td colspan="6">No hay solicitudes pendientes de revisión.</td>
        </tr>
        <tr th:each="s : ${solicitudes}">
            <td th:text="${s.idSolicitud}"></td>
            <td th:text="${s.idUsuario}"></td>
            <td th:text="${s.tipoAsistencia}"></td>
            <td th:text="${s.fechaSolicitud}"></td>
            <td th:text="${s.preferencias}"></td>
            <td>
                <form th:action="@{/tecnico/solicitudes/{id}/aprobar(id=${s.idSolicitud})}" method="post">
                    <button type="submit">Aprobar</button>
                </form>
                <form th:action="@{/tecnico/solicitudes/{id}/rechazar(id=${s.idSolicitud})}" method="post">
                    <button type="submit">Rechazar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}">Volver al inicio</a>

</div>
</body>
</html>
