<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Revisión de Solicitudes</title>
</head>
<body>
<section layout:fragment="content">

    <h2>Solicitudes pendientes de revisión</h2>

    <table class="table table-striped table-bordered">
        <thead class="table-light">
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Usuario</th>
            <th scope="col">Tipo</th>
            <th scope="col">Fecha</th>
            <th scope="col">Preferencias</th>
            <th scope="col">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(solicitudes)}">
            <td colspan="6" class="text-center">No hay solicitudes pendientes de revisión.</td>
        </tr>
        <tr th:each="s : ${solicitudes}">
            <td th:text="${s.idSolicitud}"></td>
            <td th:text="${s.idUsuario}"></td>
            <td th:text="${s.tipoAsistencia}"></td>
            <td th:text="${#temporals.format(s.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${s.preferencias}"></td>
            <td>
                <form th:action="@{/tecnico/solicitudes/{id}/aprobar(id=${s.idSolicitud})}"
                      method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-success">Aprobar</button>
                </form>
                <form th:action="@{/tecnico/solicitudes/{id}/rechazar(id=${s.idSolicitud})}"
                      method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-danger">Rechazar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>

</section>
</body>
</html>
