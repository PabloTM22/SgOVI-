<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Panel Técnico - Solicitudes</title>
</head>
<body>
<section layout:fragment="content">

    <h2>Gestión de solicitudes</h2>

    <table class="table table-striped table-bordered">
        <thead class="table-light">
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Usuario</th>
            <th scope="col">Tipo</th>
            <th scope="col">Estado</th>
            <th scope="col">Fecha</th>
            <th scope="col">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(solicitudes)}">
            <td colspan="6" class="text-center">No hay solicitudes registradas.</td>
        </tr>
        <tr th:each="s : ${solicitudes}">
            <td th:text="${s.idSolicitud}"></td>
            <td th:text="${s.idUsuario}"></td>
            <td th:text="${s.tipoAsistencia}"></td>
            <td>
                <span th:text="${s.estado}"
                      th:classappend="
                        ${s.estado == 'en revision'}           ? 'badge bg-secondary' :
                        (${s.estado == 'aprobada'}             ? 'badge bg-success'   :
                        (${s.estado == 'rechazada'}            ? 'badge bg-danger'    :
                        (${s.estado == 'cerrada con contrato'} ? 'badge bg-primary'   : 'badge bg-light text-dark')))">
                </span>
            </td>
            <td th:text="${#temporals.format(s.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
                <form th:if="${s.estado == 'en revision'}"
                      th:action="@{/tecnico/solicitudes/{id}/aprobar(id=${s.idSolicitud})}"
                      method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-success">Aprobar</button>
                </form>
                <form th:if="${s.estado == 'en revision'}"
                      th:action="@{/tecnico/solicitudes/{id}/rechazar(id=${s.idSolicitud})}"
                      method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-danger">Rechazar</button>
                </form>
                <a th:if="${s.estado == 'aprobada'}"
                   th:href="@{/tecnico/solicitudes/{id}/candidatos(id=${s.idSolicitud})}"
                   class="btn btn-sm btn-outline-primary">Proponer candidatos</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>

</section>
</body>
</html>
